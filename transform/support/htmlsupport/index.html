<!DOCTYPE html>
    <html lang="en">
    <head>
    <title>{{{translationname}}} | Read</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Read the {{{translationname}}} online: a modern English translation of the Bible, free of copyright restrictions (CC0).">
    <meta name="theme-color" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181818">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preload" href="fonts/CrimsonPro-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link href="normalize.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="bookmap.js" defer></script>
    <script src="jump.js" defer></script>
    <script src="theme.js" defer></script>
    </head>

    <body>
        <button id="themetoggle" title="Switch between light, dark and automatic colours">&#9680; Auto</button>
        <h1><img src="{{{pathtologo}}}" alt="{{{translationname}}}"></h1>
        <form id="navform">
            <input type="text" style="font-size: 140%;" id="txtSearch" aria-label="Enter reference (eg Ps 23)"/> (eg Ps 23)
        </form>

        <p>
        {{{frontmatter}}}
        </p>

        <h2>Old Testament</h2>

        <p>
        {{{ot}}}
        </p>
        <h2>New Testament</h2>
        <p>
        {{{nt}}}
        </p>
        <div class="pagefooter"><p><a href="{{{websiteURL}}}">{{{websiteName}}}</a> &middot; {{{release}}} &middot; Public domain (CC0)</p></div>
</body>
</html>
